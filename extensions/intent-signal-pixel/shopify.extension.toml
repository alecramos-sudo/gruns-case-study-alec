name = "intent-signal-pixel"
type = "web_pixel_extension"
uid = "215ce620-df53-fecd-0045-c48a7ad6e54f37c1c028"

runtime_context = "strict"

[customer_privacy]
analytics = true
marketing = false
preferences = true
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.endpoint]
name = "Signal endpoint"
description = "App endpoint for the checkout intent bridge"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.token]
name = "Signal token"
description = "Signed token for this shop"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.shop]
name = "Shop domain"
description = "MyShopify domain for this installation"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]
